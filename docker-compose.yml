services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campusmind
      POSTGRES_PASSWORD: campusmind
      POSTGRES_DB: campusmind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
