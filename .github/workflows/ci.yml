name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: campusmind
          POSTGRES_PASSWORD: campusmind
          POSTGRES_DB: campusmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusmind -d campusmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://campusmind:campusmind@localhost:5432/campusmind_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create database schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/db/001_init.sql
      - name: Typecheck
        run: npm run typecheck --workspace api
      - name: Test
        run: npm test --workspace api

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace web
      - name: Build
        run: npm run build --workspace web
